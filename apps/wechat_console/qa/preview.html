</style></head><body><div id="app"></div><div id="toast" hidden></div><script>window.MODULES={"lib/client": "/* No serial access. Requests are authenticated and mutations have monotonic IDs. */\nclass GatewayClient {\n  constructor(request, changed, now) {\n    this.request = request; this.changed = changed || (() => {}); this.now = now || Date.now;\n    this.seq = 0; this.epoch = 0; this.session = null; this.active = false; this.visible = true;\n    this.armed = false; this.wantArmed = false; this.tail = Promise.resolve(); this.polling = false; this.beating = false;\n    this.state = null; this.offset = 0; this.error = '';\n  }\n  emit() { this.changed(this.state, { connected:this.active, armed:this.armed, error:this.error }); }\n  configure(base, token) {\n    const match = /^(http):\\/\\/(\\d{1,3}(?:\\.\\d{1,3}){3})(?::(\\d{1,5}))?\\/?$/.exec(base.trim());\n    if (!match) throw new Error('请输入电脑局域网 IPv4 地址，例如 http://192.168.1.8:8765');\n    const p = match[2].split('.').map(Number), port = Number(match[3] || 80);\n    const privateIP = p[0]===10 || (p[0]===172 && p[1]>=16 && p[1]<=31) || (p[0]===192 && p[1]===168) || p[0]===127;\n    if (p.some(v => v>255) || !privateIP || port<1 || port>65535) throw new Error('仅支持同网段私有 IPv4 或本机演示地址');\n    if (!token || token.trim().length<12) throw new Error('请填写电脑网关显示的本次配对码');\n    this.base = base.trim().replace(/\\/$/, ''); this.token = token.trim();\n  }\n  api(path, data, extra) {\n    return this.request(Object.assign({url:this.base+path,method:data===undefined?'GET':'POST',data,\n      header:{Authorization:'Bearer '+this.token,'Content-Type':'application/json'},timeout:650},extra||{}))\n      .then(r => { if (r.statusCode<200 || r.statusCode>=300) throw new Error(r.data && r.data.error || '网关拒绝请求'); return r.data; });\n  }\n  async connect(base, token) {\n    this.disconnect(); this.configure(base,token); this.visible=true;\n    const epoch=++this.epoch, sent=this.now();\n    const result=await this.api('/v1/session',{label:'微信驾驶台'});\n    if(epoch!==this.epoch || !this.visible) {\n      // A delayed session response must not survive app background/disconnect.\n      this.api('/v1/action',{session_id:result.session_id,seq:1,deadline_ms:result.server_time_ms+500,action:'stop',payload:{}}).catch(()=>{});\n      return;\n    }\n    this.offset=result.server_time_ms-(sent+this.now())/2;\n    this.session=result.session_id; this.seq=0; this.active=true; this.error=''; this.armed=false;\n    await this.poll(); this.timer=setInterval(()=>{this.heartbeat();this.poll();},100); this.emit();\n  }\n  envelope(action,payload) { return {session_id:this.session,seq:++this.seq,deadline_ms:Math.floor(this.now()+this.offset+500),action,payload:payload||{}}; }\n  ingest(s) { if(s) { this.state=s; this.armed=this.wantArmed && !!(s.remote && s.remote.armed); } this.emit(); }\n  action(action,payload) {\n    const epoch=this.epoch, queued=this.now();\n    const run=async()=>{\n      if (!this.active || !this.visible || epoch!==this.epoch) throw new Error('会话已暂停，请重新连接或启用');\n      if(this.now()-queued>400) throw new Error('操作已过期，请重新点击');\n      if(action==='arm')this.wantArmed=true;\n      const result=await this.api('/v1/action',this.envelope(action,payload));\n      if(epoch===this.epoch && this.visible) this.ingest(result.state);\n      return result;\n    };\n    const promise=this.tail.then(run);\n    this.tail=promise.catch(()=>{});\n    return promise.catch(e=>{if(epoch===this.epoch){this.error=e.message;this.panic('请求失败，已撤销许可');}throw e;});\n  }\n  sendImmediate(action) {\n    if(!this.session || !this.base) return Promise.resolve();\n    return this.api('/v1/action',this.envelope(action)).catch(()=>{});\n  }\n  release() {\n    // Drop queued presses. Higher sequence makes an in-flight old press unusable.\n    ++this.epoch; this.tail=Promise.resolve();\n    return this.sendImmediate('manual.release').then(r=>{if(r && this.visible)this.ingest(r.state);});\n  }\n  panic(reason) { ++this.epoch; this.tail=Promise.resolve(); this.armed=false; this.wantArmed=false; this.error=reason||''; this.sendImmediate('stop'); this.emit(); }\n  heartbeat() {\n    if(!this.active || !this.visible || !this.armed || this.beating)return;\n    this.beating=true; this.action('heartbeat').catch(()=>{}).finally(()=>{this.beating=false;});\n  }\n  async poll() {\n    if(!this.active || !this.visible || this.polling)return;\n    this.polling=true; const epoch=this.epoch;\n    try {const s=await this.api('/v1/state'); if(epoch===this.epoch && this.visible)this.ingest(s);}\n    catch(e){if(epoch===this.epoch){this.panic('连接中断，请重新连接');this.active=false;this.emit();}}\n    finally{this.polling=false;}\n  }\n  async frame() {return this.api('/v1/vision/frame',undefined,{responseType:'arraybuffer',timeout:900});}\n  hide(){this.visible=false;this.panic('页面已离开，需重新启用');}\n  show(){this.visible=true;if(this.active)this.poll();}\n  disconnect(){if(this.timer)clearInterval(this.timer);this.timer=null;this.panic('连接已断开');this.active=false;this.session=null;this.emit();}\n}\nmodule.exports={GatewayClient};\n", "lib/demo": "const mapData=require('./map-data');\nconst clone=x=>JSON.parse(JSON.stringify(x));\nfunction route(occupied,start,goal){\n  const blocked=new Set(occupied), key=p=>p[1]*20+p[0];\n  if(!Array.isArray(start)||!Array.isArray(goal)||start.length!==2||goal.length!==2||[...start,...goal].some(v=>!Number.isInteger(v)||v<0||v>19)||blocked.has(key(goal))||blocked.has(key(start)))return [];\n  const queue=[start], parents=new Map([[key(start),null]]);\n  for(let n=0;n<queue.length;n++){\n    const p=queue[n];if(key(p)===key(goal)){\n      const out=[];let q=p;while(q){out.push(q);q=parents.get(key(q));}return out.reverse();\n    }\n    [[0,1],[-1,0],[0,-1],[1,0]].forEach(([dx,dy])=>{const q=[p[0]+dx,p[1]+dy],k=key(q);\n      if(q.every(v=>v>=0&&v<20)&&!blocked.has(k)&&!parents.has(k)){parents.set(k,p);queue.push(q);}});\n  }return [];\n}\nclass DemoClient {\n  constructor(changed){this iew class=\"grid2 action-row\"><button disabled=\"{{!connected}}\" data-action=\"vision.search\" bindtap=\"vision\">搜索数字</button><button disabled=\"{{!connected}}\" data-action=\"vision.prepare\" bindtap=\"vision\">准备新任务</button></view><view class=\"spacer\"></view><button disabled=\"{{!connected}}\" data-action=\"task.read\" bindtap=\"task\">读取已准备任务</button><view class=\"spacer\"></view><button class=\"primary\" disabled=\"{{!armed}}\" data-action=\"task.start\" bindtap=\"task\">启动智能接近任务</button></view>\n    <view class=\"card\"><view class=\"section\">当前识别目标</view><view wx-if=\"{{!state.vision.detections.length}}\" class=\"small muted\">暂无可选目标，请将数字放入画面后刷新。</view><button class=\"detection-row\" wx-for=\"{{state.vision.detections}}\" wx-key=\"detection_id\" data-row=\"{{item}}\" bindtap=\"lock\">{{item.class_name}} · #{{item.detection_id}}<text class=\"accent\"> 点选并确认</text></button></view>\n    <view class=\"card\"><view class=\"section\">目标跟随</view><view class=\"grid2\"><button disabled=\"{{!armed}}\" data-action=\"follow.start\" bindtap=\"task\">ToF 跟随20cm</button><button disabled=\"{{!armed}}\" data-action=\"follow.digit\" bindtap=\"task\">数字确认后跟随</button></view></view>\n  </block>\n  <block wx-if=\"{{tab==='connect'}}\">\n    <view class=\"card\"><view class=\"row\"><view class=\"grow\"><view class=\"section\">离线演示</view><view class=\"small muted\">无需 AppID、电脑或机器人</view></view><switch checked=\"{{demo}}\" color=\"#42ddbd\" bindchange=\"switchDemo\"/></view></view>\n    <view wx-if=\"{{!demo}}\" class=\"card\"><view class=\"section\">连接电脑中转</view><view class=\"label\">电脑网关地址</view><input value=\"{{base}}\" data-key=\"base\" bindinput=\"input\" placeholder=\"http://192.168.1.8:8765\"/><view class=\"spacer\"></view><view class=\"label\">本次配对码</view><input password=\"{{true}}\" value=\"{{token}}\" data-key=\"token\" bindinput=\"input\" placeholder=\"复制电脑驾驶台显示的配对码\"/><view class=\"grid2 action-row\"><button class=\"primary\" bindtap=\"connect\">连接网关</button><button bindtap=\"disconnect\">断开并停车</button></view><view class=\"small muted guide\">手机与电脑使用同一 Wi‑Fi。电脑需连接原蓝牙，并明确勾选本次手机控制和原运动许可。配对码只在内存保存。</view></view>\n    <view class=\"card\"><view class=\"section\">控制链路</view><view class=\"connection-flow\"><view>微信小程序</view><text>↓ 同一局域网</text><view>电脑网关 · 原驾驶台</view><text>↓ 现有蓝牙串口</text><view>FPGA · 电机与传感器</view></view><view class=\"small muted guide\">{{demo?'当前所有操作仅改变模拟状态。':'连接成功不会自动开车；手机后台、断开或许可超时后需重新启用。'}}</view></view>\n    <view class=\"card\"><view class=\"row\" bindtap=\"toggleAdvanced\"><view class=\"section grow\">维护与诊断</view><text class=\"muted\">{{advanced?'收起 −':'展开 +'}}</text></view><block wx-if=\"{{advanced}}\"><view class=\"grid3\"><view><view class=\"label\">P</view><input type=\"number\" value=\"{{p}}\" data-key=\"p\" bindinput=\"input\"/></view><view><view class=\"label\">I</view><input type=\"number\" value=\"{{i}}\" data-key=\"i\" bindinput=\"input\"/></view><view><view class=\"label\">D</view><input type=\"number\" value=\"{{d}}\" data-key=\"d\" bindinput=\"input\"/></view></view><view class=\"spacer\"></view><button disabled=\"{{!armed}}\" bindtap=\"pid\">停车后发送 PID 参数</button><view class=\"small muted guide\">P、D 0–32；I 0–8。发送后撤销运动许可，电脑需重新核对。</view><view class=\"log small muted\" wx-for=\"{{state.remote.events}}\" wx-key=\"at\">{{item.message}}</view></block></view>\n  </block>\n  <view class=\"footer\"><view class=\"stop-bar\" bindtap=\"stop\"><view class=\"stop-icon\">■</view><view class=\"grow\">停止 S<view class=\"stop-sub\">取消当前运动与任务</view></view><text class=\"stop-key\">STOP</text></view><view class=\"tabbar\"><view wx-for=\"{{tabs}}\" wx-key=\"id\" data-tab=\"{{item.id}}\" bindtap=\"selectTab\" class=\"tab {{tab===item.id?'active':''}}\"><view class=\"tab-mark\">{{item.mark}}</view><text>{{item.name}}</text></view></view></view>\n</view>\n";</script><script>/* DOM layout adapter only. Never connects to PC, Pi, or hardware. */
const app={},cache={};let page,scheduled=false;

  const relative=p=>{let parts=id.split('/');parts.pop();for(const part of p.split('/')){if(part==='..')parts.pop();else if(part!=='.')parts.push(part);}return parts.join('/');};
  new Function('require','module','exports',MODULES[id])(p=>load(relative(p)),m,m.exports);return m.exports;}
window.getApp=()=>app;

const toast=text=>{const el=document.querySelector('#toast');el.textContent=text;el.hidden=false;setTimeout(()=>el.hidden=true,2200);};

  createSelectorQuery:()=>{let selector,callback;const q={in:()=>q,select:s=>(selector=s,q),boundingClientRect:f=>(callback=f,q),exec:()=>setTimeout(()=>{const e=document.querySelector(selector);callback(e?e.getBoundingClientRect():null);},30)};return q;},
  createCanvasContext:id=>{const el=document.querySelector(`[data-canvas-id="${id}"]`);if(!el)return new Proxy({},{get:()=>()=>{}});
    const width=el.getBoundingClientRect().width;if(el.width!==Math.round(width)){el.width=Math.round(width);el.height=Math.round(width);}
    const c=el.getContext('2d');const props={setFillStyle:'fillStyle',setStrokeStyle:'strokeStyle',setLineWidth:'lineWidth',setFontSize:'font',setTextAlign:'textAlign',setTextBaseline:'textBaseline'};
    return new Proxy({},{get:(_,method)=>method==='draw'?()=>{}:props[method]?value=>{c[props[method]]=method==='setFontSize'?`${value}px sans-serif`:value;}:typeof c[method]==='function'?c[method].bind(c):c[method]});}
};
const evaluate=(s,scope)=>{try{return new Function('scope','with(scope){return ('+s+');}')(scope);}catch(e){return undefined;}};
function value(s,scope){const full=/^{{((?:(?!}})[\s\S])*)}}$/.exec(s);if(full)return evaluate(full[1],scope);return s.replace(/{{([\s\S]*?)}}/g,(_,expr)=>{const v=evaluate(expr,scope);return v==null?'':String(v);});}
const xml=new DOMParser().parseFromString('<root>'+WXML+'</root>','text/xml');

function children(parent,scope,target){let branch=false;
  for(const node of parent.childNodes){if(node.nodeType===3){target.appendChild(document.createTextNode(value(node.textContent,scope)));continue;}if(node.nodeType!==1)continue;
    if(node.hasAttribute('wx-if')){branch=!!value(node.getAttribute('wx-if'),scope);if(!branch)continue;}
    else if(node.hasAttribute('wx-elif')){if(branch)continue;branch=!!value(node.getAttribute('wx-elif'),scope);if(!branch)continue;}
    else if(node.hasAttribute('wx-else')){if(branch)continue;branch=true;}else branch=false;
    if(node.hasAttribute('wx-for')){const rows=value(node.getAttribute('wx-for'),scope)||[];rows.forEach((item,index)=>element(node,Object.assign({},scope,{item,index}),target));}

function element(node,scope,target){const tag=node.tagName;
  if(tag==='block'){children(node,scope,target);return;}
  const htmlTag={view:'div',text:'span',image:'img',picker:'select',switch:'input',input:'input',canvas:'canvas',button:'button'}[tag]||'div';
  const el=document.createElement(htmlTag),dataset={};
  for(const a of node.attributes){if(a.name.startsWith('wx-')||a.name.startsWith('bind'))continue;const v=value(a.value,scope);
    if(a.name.startsWith('data-')){dataset[a.name.slice(5)]=v;el.setAttribute(a.name,typeof v==='object'?JSON.stringify(v):v);}
    else if(a.name==='canvas-id')el.setAttribute('data-canvas-id',v);
    else if(a.name==='disabled')el.disabled=!!v;
    else if(a.name==='password')el.type='password';
    else if(a.name==='value')el.value=v;
    else if(a.name==='checked')el.checked=!!v;
    else el.setAttribute(a.name,v==null?'':v);
  }
  if(tag==='switch')el.type='checkbox';

  else if(tag!=='input'&&tag!=='switch')children(node,scope,el);

  for(const [binding,eventName] of Object.entries(events)){if(!node.hasAttribute(binding))continue;el.addEventListener(eventName,event=>{
