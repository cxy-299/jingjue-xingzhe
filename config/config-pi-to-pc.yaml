camera:
  backend: picamera2
  width: 640
  height: 480
  fps: 20
  flip_horizontal: false
  flip_vertical: false

model:
  path: yolo11n.pt
  conf_threshold: 0.45
  iou_threshold: 0.50
  imgsz: 416
  device: cpu

target:
  class_names: ["person"]
  selection: largest
  min_area_ratio: 0.002

serial:
  enabled: false
  port: /dev/serial0
  baudrate: 115200
  timeout: 0.0
  write_timeout: 0.1
  reconnect_interval_s: 2.0
  heartbeat_interval_ms: 500

visual_alignment:
  center_target: 5000
  center_deadband: 0.08
  max_vy: 0.22
  lateral_gain: 1.15
  smoothing_alpha: 0.35
  search_omega: 0.20
  target_confirm_frames: 2
  lost_confirm_frames: 2

# 第一阶段先在树莓派单机验证识别，不连接FPGA/PC接收端。
mock_fpga:
  enabled: true
  # Windows 互联网连接共享（ICS）在本次直连部署中的电脑端地址。
  host: 192.168.137.1
  port: 9999

# 无显示器/SSH运行时保持false，性能也更好。
display:
  enabled: false
  show_all_detections: true
  show_fps: true
  window_name: LingShu Vision Pi

runtime:
  print_interval_s: 0.5
